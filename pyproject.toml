[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "healthcare-population-health-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["polars>=1.30,<2", "duckdb>=1.3,<2", "dbt-duckdb>=1.9,<2", "dbt-snowflake>=1.9,<2", "snowflake-connector-python>=3.14,<5", "prefect>=3,<4", "streamlit>=1.45,<2", "plotly>=6,<7", "openai>=1.70,<3", "pyyaml>=6,<7"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
healthcare = "healthcare.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
